# Replace the host name and certificate paths before enabling this site.
# Uvicorn trusts forwarded headers only from its loopback proxy. Overwrite the
# client address here instead of accepting a user-supplied X-Forwarded-For.

server {
    listen 80;
    listen [::]:80;
    server_name literature.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name literature.example.org;

    ssl_certificate     /etc/letsencrypt/live/literature.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/literature.example.org/privkey.pem;

    client_max_body_size 2m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
